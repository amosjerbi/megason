     const qa=ux*ux+uy*uy+uz*uz,qb=2*(ox*ux+oy*uy+oz*uz),qc=ox*ox+oy*oy+oz*oz-1,disc=qb*qb-4*qa*qc;

   hg.computeVertexNormals();P(hg,skin,C1[0],C1[1],C1[2],head);}
  // horseshoe of hair: a band around the sides and back at ear height, the crown stays bare

    P(new THREE.SphereGeometry(.0085,6,5),dark,sx+(lazy?.009:0),.142+(lazy?-.005:0),.101,head);
    const br=P(boxGeo(.046,.012,.014),hairD,sx,.172,.103,head);br.rotation.z=sx>0?-.14:.14;   // inner ends raised: worried
    P(new THREE.TorusGeometry(.027,.0048,6,20),dark,sx,.142,.11,head);
    const tm=P(boxGeo(.006,.006,.105),dark,sx*1.68,.146,.058,head);tm.rotation.y=sx>0?-.12:.12;}
  P(boxGeo(.03,.006,.006),dark,0,.147,.112,head);
