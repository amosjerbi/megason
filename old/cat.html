<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Megason Cat</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dialkit@2.1.0/dist/vanilla/styles.css">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e9e1d4;font-family:Inter,system-ui,sans-serif}
  canvas{display:block}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Standalone viewer for a sitting black cat figurine, built on the same low-poly basis as the shopkeeper (shopkeeper.html):
// flat-shaded primitives, a smooth-union skull + muzzle head, and every feature driven by the DialKit panel.
const scene=new THREE.Scene();scene.background=new THREE.Color(0xe9e1d4);
const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,.01,50);camera.position.set(-.42,.52,1.3);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true}); /* preserveDrawingBuffer lets DialKit capture version thumbnails */ renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x887766,1.5));
const sun=new THREE.DirectionalLight(0xffffff,1.8);sun.position.set(-2,3,3);scene.add(sun);
const rim=new THREE.DirectionalLight(0xbfd4ff,.8);rim.position.set(2,2,-3);scene.add(rim);
const floorMat=new THREE.MeshLambertMaterial({color:0xcdb89c});
const floor=new THREE.Mesh(new THREE.CircleGeometry(.7,48),floorMat);floor.rotation.x=-Math.PI/2;scene.add(floor);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.32,0);controls.enableDamping=true;controls.minDistance=.2;controls.maxDistance=4;controls.update();

// any CSS colour (hex, rgb, hsl, oklch, display-p3...) -> THREE.Color, via a 1px canvas for formats three can't parse
const _cc=document.createElement('canvas');_cc.width=_cc.height=1;const _cx=_cc.getContext('2d',{willReadFrequently:true});
function col(v){const c=new THREE.Color();if(typeof v==='number')return c.set(v);if(/^(#|rgb|hsl)/i.test(v))return c.setStyle(v);
  _cx.clearRect(0,0,1,1);_cx.fillStyle='#000';_cx.fillStyle=v;_cx.fillRect(0,0,1,1);const d=_cx.getImageData(0,0,1,1).data;return c.setRGB(d[0]/255,d[1]/255,d[2]/255,THREE.SRGBColorSpace);}

// Controls. Slider tuples are [default, min, max, step].
const CFG={
  fur:{color:'#1e1d24',gloss:[40,0,120,1]},
  body:{width:[1,.8,1.25,.01],height:[1,.8,1.3,.01],facets:[14,6,32,1],haunches:[1,0,1.4,.05]},
  head:{width:[1,.8,1.25,.01],height:[1,.8,1.2,.01],depth:[1,.85,1.2,.01],muzzle:[1,.7,1.3,.01],facets:[12,6,32,1]},
  ears:{height:[1,.6,1.5,.02],width:[1,.7,1.4,.02],spread:[.62,.3,1,.01],tilt:[.12,-.2,.5,.01],inner:'#3c4a8e',lashes:true},
  eyes:{spacing:[.058,.04,.075,.001],height:[.006,-.02,.03,.001],size:[.031,.02,.042,.001],round:[1.12,.8,1.5,.02],white:'#f5f3ee',pupil:'#141318',
    pupilWidth:[.38,.15,.8,.01],pupilHeight:[.72,.3,1,.01],cross:[.003,-.006,.01,.0005],lazyX:[0,-.008,.008,.0005]},
  nose:{color:'#e07a4a',size:[1,.5,1.8,.05],height:[-.03,-.05,-.01,.001]},
  mouth:{show:true,color:'#0c0b0e'},
  whiskers:{show:true,color:'#7c7b86',length:[1,.5,1.6,.05],droop:[.12,-.2,.4,.01],_collapsed:true},
  bow:{show:true,color:'#b3302d',size:[1,.6,1.4,.02],tails:[1,0,1.5,.05],wave:[.35,0,1.2,.05],height:[0,-.04,.04,.002]},
  tail:{show:true,curl:[.75,.2,1.1,.01],thickness:[1,.6,1.5,.05],_collapsed:true},
  paws:{toes:true,_collapsed:true},
  scene:{background:'#e9e1d4',floor:'#cdb89c',animate:true,_collapsed:true},
};
// the same config resolved to plain default values (used if DialKit can't load)
const defaults=c=>Object.fromEntries(Object.entries(c).filter(([k])=>k[0]!=='_').map(([k,v])=>[k,Array.isArray(v)?v[0]:(v&&typeof v==='object')?defaults(v):v]));

const V=(x,y,z)=>new THREE.Vector3(x,y,z);
// a flat ribbon (bow tails) along a curve; wave twists it around its own length
function ribbonGeo(pts,width,thick,wave){
  const curve=new THREE.CatmullRomCurve3(pts),N=22,pos=[],idx=[];
  for(let i=0;i<=N;i++){const u=i/N,p=curve.getPoint(u),t=curve.getTangent(u);
    const side=new THREE.Vector3().crossVectors(t,V(0,0,1)).normalize().applyAxisAngle(t,wave*Math.sin(u*Math.PI*2.2));
    const nrm=new THREE.Vector3().crossVectors(side,t).normalize(),w=width*(1-.25*u)/2;
    for(const[a,b]of[[1,1],[-1,1],[-1,-1],[1,-1]]){const q=p.clone().addScaledVector(side,a*w).addScaledVector(nrm,b*thick/2);pos.push(q.x,q.y,q.z);}}
  for(let i=0;i<N;i++)for(let j=0;j<4;j++){const a=i*4+j,b=i*4+(j+1)%4,c=a+4,d=b+4;idx.push(a,c,b,b,c,d);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();return g;}

let cat=null;
function buildCat(D){
  const g=new THREE.Group();scene.add(g);
  const F=D.fur,B=D.body,H=D.head,E=D.ears,Y=D.eyes,N=D.nose,W=D.whiskers,BW=D.bow,T=D.tail;
  const glossy=(c,s=F.gloss)=>new THREE.MeshPhongMaterial({color:col(c),shininess:s,specular:0x3a3a44,flatShading:true});
  const fl=c=>new THREE.MeshLambertMaterial({color:col(c),flatShading:true});
  const fur=glossy(F.color),inner=glossy(E.inner,F.gloss*.6),white=glossy(Y.white,60),pupil=glossy(Y.pupil,90),nose=glossy(N.color,50),
    whisk=fl(W.color),mouth=fl(D.mouth.color),bowM=glossy(BW.color,F.gloss*.8);bowM.side=THREE.DoubleSide;
  const P=(geo,mat,px,py,pz,par=g)=>{const m=new THREE.Mesh(geo,mat);m.position.set(px,py,pz);par.add(m);return m;};
  const ZS=.85; // body cross-section: a little narrower front-to-back

  // ---- body: a seated bowling-pin lathe, wide hips narrowing to the neck
  const prof=[[0,0],[.12,0],[.145,.03],[.15,.07],[.145,.12],[.13,.17],[.11,.22],[.092,.27],[.08,.31],[.072,.34],[0,.37]].map(([r,y])=>[r*B.width,y*B.height]);
  const rAt=y=>{for(let i=1;i<prof.length;i++)if(y<=prof[i][1]){const[r0,y0]=prof[i-1],[r1,y1]=prof[i];return r0+(r1-r0)*(y-y0)/Math.max(1e-6,y1-y0);}return 0;};
  const bodyZ=(x,y)=>{const r=rAt(y);return r*ZS*Math.sqrt(Math.max(0,1-(x/Math.max(r,1e-6))**2));}; // front surface of the body
  const torso=P(new THREE.LatheGeometry(prof.map(([r,y])=>new THREE.Vector2(r,y)),Math.round(B.facets)),fur,0,0,0);torso.scale.z=ZS;
  if(B.haunches>0)for(const s of[-1,1]){const h=P(new THREE.SphereGeometry(.085*B.haunches,10,8),fur,s*.088*B.width,.09*B.height,-.01);h.scale.set(.72,1,1.3);}
  // front legs straight down the chest, paws with toe bumps; back paws peeking out from the haunches
  const toes=(px,pz,ry,r)=>{if(!D.paws.toes)return;for(const k of[-1,0,1]){const tx=px+Math.cos(ry)*k*r*.42+Math.sin(ry)*r*1.05,tz=pz-Math.sin(ry)*k*r*.42+Math.cos(ry)*r*1.05;
    const t=P(new THREE.SphereGeometry(r*.42,6,5),fur,tx,r*.4,tz);t.scale.set(1,.85,1.1);}};
  for(const s of[-1,1]){const lx=s*.036*B.width,lz=bodyZ(lx,.12)-.025;
    const leg=P(new THREE.CapsuleGeometry(.03*B.width,.17*B.height,4,8),fur,lx,.12*B.height,lz);leg.rotation.x=-.06;
    const paw=P(new THREE.SphereGeometry(.036*B.width,8,6),fur,lx,.022,lz+.02);paw.scale.set(1,.62,1.3);toes(lx,lz+.03,0,.034*B.width);
    const bx=s*.11*B.width,bz=.055,bp=P(new THREE.SphereGeometry(.04*B.width,8,6),fur,bx,.02,bz);bp.scale.set(1,.55,1.4);bp.rotation.y=s*.3;toes(bx,bz+.01,s*.3,.036*B.width);}
  // tail wrapped around the base, from the back round the right side
  const tail=new THREE.Group();g.add(tail);
  if(T.show){const R=.165*B.width,n=8,pts=[];for(let k=0;k<=n;k++){const a=k/n*T.curl*Math.PI,r=R+.012*k/n;pts.push(V(r*Math.sin(a),k===0?.07:k===1?.04:.022,-r*Math.cos(a)));}
    const tr=.021*T.thickness;P(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),24,tr,6),fur,0,0,0,tail);const end=pts[n];P(new THREE.SphereGeometry(tr,6,5),fur,end.x,end.y,end.z,tail);}

  // ---- head: smooth union of a wide skull and a soft muzzle, low-res so the planes read
  const HY=prof[prof.length-2][1]+.085*H.height;
  const head=new THREE.Group();head.position.y=HY;g.add(head);
  const A1=[.135*H.width,.112*H.height,.112*H.depth],C2=[0,-.04*H.height,.03*H.depth],A2=[.095*H.muzzle,.068*H.height,.09*H.depth];
  {const K=.02,seg=Math.round(H.facets),hg=new THREE.SphereGeometry(1,seg,Math.max(4,Math.round(seg*.8))),pa=hg.attributes.position;
   for(let i=0;i<pa.count;i++){const dx=pa.getX(i),dy=pa.getY(i),dz=pa.getZ(i);
     const r1=1/Math.sqrt((dx/A1[0])**2+(dy/A1[1])**2+(dz/A1[2])**2);
     const ox=-C2[0]/A2[0],oy=-C2[1]/A2[1],oz=-C2[2]/A2[2],ux=dx/A2[0],uy=dy/A2[1],uz=dz/A2[2];
     const qa=ux*ux+uy*uy+uz*uz,qb=2*(ox*ux+oy*uy+oz*uz),qc=ox*ox+oy*oy+oz*oz-1,disc=qb*qb-4*qa*qc;
     const r2=disc>0?Math.max(0,(-qb+Math.sqrt(disc))/(2*qa)):0;
     const h=Math.max(K-Math.abs(r1-r2),0)/K,r=Math.max(r1,r2)+h*h*K*.25;
     pa.setXYZ(i,dx*r,dy*r,dz*r);}
   hg.computeVertexNormals();P(hg,fur,0,0,0,head);}
  // a point on the front of the head at (x,y) and its outward normal, so features follow the sliders
  const onFace=(x,y,push=0)=>{let best=null;for(const[c,a]of[[[0,0,0],A1],[C2,A2]]){const k=1-((x-c[0])/a[0])**2-((y-c[1])/a[1])**2;if(k<=0)continue;
      const z=c[2]+a[2]*Math.sqrt(k);if(!best||z>best.p.z)best={p:V(x,y,z),n:V((x-c[0])/a[0]**2,(y-c[1])/a[1]**2,(z-c[2])/a[2]**2).normalize()};}
    if(!best)best={p:V(x,y,0),n:V(Math.sign(x)||0,0,0)};best.p.addScaledVector(best.n,push);return best;};
  const facing=(m,n)=>m.quaternion.setFromUnitVectors(V(0,0,1),n);

  // ears: tall flat triangles, blue inside, leaning out; optional lashes along the inner edge
  const ears=[];
  for(const s of[-1,1]){const ew=.11*E.width,eh=.17*E.height,dep=.016;
    const ear=new THREE.Group();const phi=E.spread;ear.position.set(s*A1[0]*Math.sin(phi)*.9,A1[1]*Math.cos(phi)*.9-.012,-.012);
    ear.rotation.order='ZYX';ear.rotation.z=-s*(phi*.55+E.tilt);ear.rotation.y=-s*.3;ear.rotation.x=-.12;head.add(ear);ears.push(ear);
    const tri=(w,h,ox=0)=>{const sh=new THREE.Shape();sh.moveTo(-w/2+ox,0);sh.lineTo(w/2+ox,0);sh.lineTo(s*w*.08+ox,h);sh.closePath();return sh;};
    const outer=new THREE.ExtrudeGeometry(tri(ew,eh),{depth:dep,bevelEnabled:true,bevelSize:.004,bevelThickness:.004,bevelSegments:1});outer.translate(0,0,-dep/2);P(outer,fur,0,0,0,ear);
    const ig=new THREE.ExtrudeGeometry(tri(ew*.66,eh*.74),{depth:.003,bevelEnabled:false});P(ig,inner,0,eh*.1,dep/2+.003,ear);
    if(E.lashes)for(let k=0;k<4;k++){const u=.06+k*.075,lx=-s*(ew/2)*(1-u)+s*ew*.08*u,ly=eh*u; // fringe on the lower inner edge, poking toward the forehead
      const l=P(new THREE.BoxGeometry(.0028,.017,.0028),fur,lx-s*.007,ly+.004,dep*.3,ear);l.rotation.z=s*(1.05+k*.08);}}

  // eyes: round whites with tall slit pupils; cross pulls the pupils inward, lazyX drifts the cat's left eye
  const eyes=[];
  for(const s of[-1,1]){const f=onFace(s*Y.spacing,Y.height,-.004);
    const eye=new THREE.Group();eye.position.copy(f.p);facing(eye,f.n);head.add(eye);eyes.push(eye);
    const w=P(new THREE.SphereGeometry(Y.size,12,8),white,0,0,0,eye);w.scale.set(1,Y.round,.32);
    const px=-s*Y.cross+(s>0?Y.lazyX:0);
    const pp=P(new THREE.SphereGeometry(Y.size,10,8),pupil,px,0,Y.size*.27,eye);pp.scale.set(Y.pupilWidth*.62,Y.round*Y.pupilHeight,.1);}
  // nose: a small orange triangle at the top of the muzzle; mouth: a tiny dark dot below it
  {const f=onFace(0,N.height,.001),n=P(new THREE.ConeGeometry(.009*N.size,.012*N.size,3),nose,0,0,0,head);n.position.copy(f.p);n.rotation.set(Math.PI/2,0,Math.PI);n.scale.z=.6;
   if(D.mouth.show){const m=onFace(0,N.height-.028,.0005),mo=P(new THREE.SphereGeometry(.0035,6,4),mouth,0,0,0,head);mo.position.copy(m.p);facing(mo,m.n);mo.scale.set(1.2,.8,.4);}}
  // whiskers: two thin grey strokes per cheek running out past the head
  if(W.show)for(const s of[-1,1])for(const k of[0,1]){const f=onFace(s*.055,N.height-.012-k*.016,.001),len=.075*W.length;
    const w=P(new THREE.BoxGeometry(len,.0026,.0026),whisk,0,0,0,head);
    w.position.copy(f.p).add(V(s*len*.42,0,-len*.18));w.rotation.order='YXZ';w.rotation.y=s*.4;w.rotation.z=-s*(W.droop+(k?.12:-.04));}

  // ---- bow at the throat: knot, two flattened loops, two wavy tails down the chest
  if(BW.show){const sz=BW.size,by=HY+C2[1]-A2[1]+.012+BW.height,kz=Math.max(bodyZ(0,by),onFace(0,by-HY).p.z)+.012;
    const bow=new THREE.Group();bow.position.set(0,by,kz);g.add(bow);
    const knot=P(new THREE.SphereGeometry(.02*sz,8,6),bowM,0,0,.012*sz,bow);knot.scale.set(1.1,1,.8);
    // loops: puffy teardrops facing forward, swept back around the neck
    const loop=new THREE.Shape();loop.moveTo(0,0);loop.bezierCurveTo(.025,.05,.085,.052,.092,.012);loop.bezierCurveTo(.098,-.032,.045,-.036,0,0);
    const lg=new THREE.ExtrudeGeometry(loop,{depth:.014,bevelEnabled:true,bevelSize:.008,bevelThickness:.008,bevelSegments:1,curveSegments:4});lg.scale(sz,sz,sz);
    const fold=new THREE.Shape();fold.moveTo(0,0);fold.bezierCurveTo(.02,.022,.05,.024,.056,.008);fold.bezierCurveTo(.05,-.01,.025,-.012,0,0);
    const fg=new THREE.ShapeGeometry(fold,3);fg.scale(sz,sz,sz);const foldM=glossy(col(BW.color).multiplyScalar(.6),20);foldM.side=THREE.DoubleSide;
    for(const s of[-1,1]){const lp=new THREE.Group();lp.position.set(s*.008*sz,.002,0);lp.rotation.order='YXZ';lp.rotation.y=-s*.38;lp.rotation.z=s*.06;lp.scale.x=s;bow.add(lp);
      P(lg,bowM,0,0,-.004,lp);P(fg,foldM,.012*sz,.002,.0225*sz,lp);
      if(BW.tails>0){const ys=[-.008,-.05,-.095,-.145,-.19].map(y=>y*BW.tails),xs=[.008,.045,.03,.06,.048];
        const pts=ys.map((y,i)=>{const x=s*xs[i]*sz,wy=by+y;return V(x,y,Math.max(bodyZ(x,wy),wy>HY-.12?onFace(x,wy-HY).p.z:0)-kz+.008);});pts[0].z=.006;
        P(ribbonGeo(pts,.03*sz,.006*sz,BW.wave),bowM,0,0,0,bow);}}}

  let nextBlink=1.5+Math.random()*3,nextTwitch=3+Math.random()*4;
  const anim=t=>{ // a slow head tilt, blinks, an occasional ear twitch, a lazy tail sway
    head.rotation.z=Math.sin(t*.5)*.05;head.rotation.y=Math.sin(t*.31)*.09;head.rotation.x=Math.sin(t*.42)*.02;
    let ey=1;if(t>nextBlink){const k=(t-nextBlink)/.16;if(k<1)ey=1-Math.sin(k*Math.PI)*.92;else nextBlink=t+2+Math.random()*4;}
    for(const e of eyes)e.scale.y=ey;
    let tw=0;if(t>nextTwitch){const k=(t-nextTwitch)/.25;if(k<1)tw=Math.sin(k*Math.PI)*.25;else nextTwitch=t+3+Math.random()*5;}
    ears[1].rotation.x=-.12-tw;
    tail.rotation.y=Math.sin(t*.9)*.05;};
  cat={g,head,anim};
}

function disposeTree(g){g.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){if(o.material.map)o.material.map.dispose();o.material.dispose();}});}
let animate=true;
function build(D){if(cat){scene.remove(cat.g);disposeTree(cat.g);}buildCat(D);
  scene.background.copy(col(D.scene.background));floorMat.color.copy(col(D.scene.floor));animate=D.scene.animate!==false;}
build(defaults(CFG));
// DialKit panel: every change rebuilds the cat (batched to one rebuild per frame). Values persist in this browser.
try{const {createDialKit,createDialRoot}=await import('https://cdn.jsdelivr.net/npm/dialkit@2.1.0/dist/vanilla/index.js');
  createDialRoot({position:'top-right',theme:'dark'});
  const kit=createDialKit('Cat',CFG,{id:'megason-cat-v2',persist:true});
  let pending=null;kit.subscribe(v=>{const first=pending===null;pending=v;if(first)requestAnimationFrame(()=>{const d=pending;pending=null;build(d);});});
}catch(err){console.warn('DialKit did not load; showing the cat with default values.',err);}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
renderer.setAnimationLoop(t=>{if(animate)cat.anim(t/1000);controls.update();renderer.render(scene,camera);});
</script>
</body>
</html>
